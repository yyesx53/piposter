<!DOCTYPE html>
<html lang="tr">
<head>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <input class="search" placeholder="Tasarımcı, ürün veya kategori ara" />

  <div class="nav-actions">
    <span>Giriş Yap</span>
    <span>Sepetim</span>
  </div>
</header>

<nav class="categories">
  <a>Ev</a>
  <a>Sanat</a>
  <a>Takı</a>
  <a>Kadın</a>
  <a>Erkek</a>
  <a>Yaşam</a>
  <a>Ofis</a>
  <a>Teknoloji</a>
  <a>Çocuk</a>

<main class="container">

    <button>Filtrele</button>
    <button>İndirimdekiler</button>
    <button>Aynı Gün Kargo</button>

  <section class="grid">

<script src="script.js"></script>
